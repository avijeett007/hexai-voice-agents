# GitHub Actions Workflow for hexai_ai_agent
# Location: hexai_ai_agent/.github/workflows/sync-to-org.yml

name: Sync to Organization Repo

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'hotfix/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ORG_SYNC_TOKEN }}
      
      - name: Set up Git
        run: |
          git config --global user.name "Hexai Sync Bot"
          git config --global user.email "sync-bot@hexai.care"
      
      - name: Add organization remote
        run: |
          git remote add org https://x-access-token:${{ secrets.ORG_SYNC_TOKEN }}@github.com/Hexai-Care-Limited/hexai-voice-agents.git
      
      - name: Fetch organization repo
        run: |
          git fetch org
      
      - name: Push to organization repo
        run: |
          BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
          echo "Syncing branch: $BRANCH_NAME"
          git push org $BRANCH_NAME:$BRANCH_NAME --force-with-lease
      
      - name: Push tags
        run: |
          git push org --tags --force-with-lease
        continue-on-error: true
      
      - name: Sync complete
        run: |
          echo "✅ Successfully synced to Hexai-Care-Limited/hexai-voice-agents"

