version: '3.8'

services:
  oyos-memory-agent:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: oyos-memory-agent
    restart: unless-stopped
    ports:
      - "8080:8080"  # Main LiveKit agents port
      - "7880:7880"  # Additional port for LiveKit web interface (if needed)
    environment:
      - PYTHONUNBUFFERED=1
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISC_SUMMARY_API_URL=${DISC_SUMMARY_API_URL}
      - DISC_SUMMARY_API_KEY=${DISC_SUMMARY_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - QDRANT_HOST=${QDRANT_HOST}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_TLS=${QDRANT_TLS:-true}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./models:/app/models
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - oyos-network
    # If you want to check logs directly
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  oyos-network:
    driver: bridge