version: '3.8'

services:
  nhs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexai-livekit-agent
    restart: unless-stopped
    ports:
      - "8080:8080"  # Main LiveKit agents port
      - "7880:7880"  # Additional port for LiveKit web interface (if needed)
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro  # Read-only mount for security
    networks:
      - hexai-network
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "python", "|", "grep", "nhs_agents.py", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    # Resource limits (adjust based on your server capacity)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

networks:
  hexai-network:
    driver: bridge